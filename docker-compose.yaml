services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    volumes:
      - ./apps/web:/usr/src/app/apps/web
      - ./packages:/usr/src/app/packages
      - node_modules:/usr/src/app/node_modules
      - node_modules-web:/usr/src/app/apps/web/node_modules
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  node_modules:
  node_modules-web:
